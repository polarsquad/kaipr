# SOPS configuration. Encrypts only the `data`/`stringData` fields of any
# manifest named `*.sops.yaml` under workload/, leaving keys/metadata readable.
#
# The `age` recipient below is a PUBLIC key — safe to commit. The matching
# PRIVATE key lives in `age.agekey` (gitignored) and is loaded into the
# cluster as the `sops-age` secret in flux-system by bootstrap
# (bootstrap-common.sh) so Flux can decrypt on reconcile.
#
# To rotate or add recipients, edit this file and run:  mise run sops-updatekeys
creation_rules:
  - path_regex: workload/.*\.sops\.yaml$
    encrypted_regex: "^(data|stringData)$"
    age: age1l0aya3rslcvk28h5l2y449ujpwy5xpm06gr0qcyuwncahdcdj98svvtqy2
