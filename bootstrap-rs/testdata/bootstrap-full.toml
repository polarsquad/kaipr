# Multi-environment bootstrap.toml fixture for engine-semantics tests.
#
# The bootstrap engine is generic over environments, so engine-semantics
# tests (profile precedence, file-order error messages) run against this
# fixture. Repo-identity tests use the real (lean) bootstrap.toml.

[bootstrap]
default-environment = "local-host"
kind-cluster = "kaipr"
kind-context = "kind-kaipr"
registry-name = "kaipr-registry"
flux-namespace = "flux-system"

[charts]
# renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
flux-operator = "0.61.0"

[environments.local-host]
kind = "local-host"
# Flux syncs the OCI artifact published from the checkout by oci-push.
sync = "oci"
sync-path = "workload/local-host"

[environments.dev-laptop]
kind = "dev-laptop"
sync = "oci"
sync-path = "workload/local-host"
