# Repository-owned configuration for kaipr-bootstrap.
#
# Everything repository-specific the binary needs is declared here; the
# binary itself is a generic bootstrap engine. Environment variables
# (REGISTRY_PORT, LOCAL_RECONCILE_TIMEOUT, ...) keep their precedence over
# these values at runtime. Locate this file with BOOTSTRAP_CONFIG when not
# running from the repository root.
#
# Profile resolution: the [environments.*] section name is authoritative;
# KAIPR_PROFILE matches it exactly. Each environment's `kind` restates the
# section name, and the cross-check fails if the two disagree.

[bootstrap]
default-environment = "local-host"
kind-cluster = "kaipr"
kind-context = "kind-kaipr"
registry-name = "kaipr-registry"
flux-namespace = "flux-system"

[charts]
# Chart versions installed imperatively before Flux exists. This pin is
# imperative-only: nothing in Git pins the flux-operator chart (the
# FluxInstance it installs is created by helm), so `mise run validate`
# cross-checks that no HelmRelease for it appears under workload/, and
# Renovate updates the pin here.
# renovate: datasource=docker depName=ghcr.io/controlplaneio-fluxcd/charts/flux-operator
flux-operator = "0.61.0"

[environments.local-host]
kind = "local-host"
# Flux syncs the OCI artifact published from the checkout by oci-push.
sync = "oci"
# Root path of the artifact the FluxInstance reconciles: the AI platform
# (workload/local-host/kustomization.yaml -> flux-ks.yaml).
sync-path = "workload/local-host"
