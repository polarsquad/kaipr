<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060">
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5CE0B4"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#859D91"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B0F6C0"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <rect width="1600" height="1060" fill="#0C120F"/>

  <!-- ===== title block ===== -->
  <text x="800" y="60" text-anchor="middle" font-family="DejaVu Sans" font-size="40" font-weight="bold" fill="#5CE0B4">kaipr &#183; local-host Environment &#183; One Cluster, Zero Cloud</text>
  <text x="800" y="96" text-anchor="middle" font-family="DejaVu Sans" font-size="19" fill="#859D91">Flux + kind &#183; a local OCI registry replaces GitHub &#183; no CAPI, no pivot, no plaintext secrets &#183; the whole GitOps chain on one laptop</text>

  <!-- ===== section headers ===== -->
  <text x="64" y="138" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#FFFFFF">TOPOLOGY (all containers on your laptop)</text>
  <text x="1090" y="138" font-family="DejaVu Sans" font-size="20" font-weight="bold" fill="#FFFFFF">FLOW (bootstrap, then reconcile)</text>

  <!-- ===== connections (behind boxes) ===== -->
  <!-- artifact -> cluster Flux -->
  <path d="M700,420 H380 V470" fill="none" stroke="#B0F6C0" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrow-purple)"/>
  <!-- host -> cluster kubeconfig -->
  <path d="M290,780 V700" fill="none" stroke="#5CE0B4" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arrow-teal)"/>
  <!-- host pushes to registry -->
  <line x1="1046" y1="300" x2="1016" y2="300" stroke="#859D91" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- ===== single cluster ===== -->
  <rect x="64" y="150" width="620" height="540" rx="14" fill="#131E18" stroke="#284637" stroke-width="1.5"/>
  <rect x="80" y="158" width="588" height="5" rx="2.5" fill="#5CE0B4"/>
  <text x="374" y="198" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#5CE0B4">Single kind cluster: kaipr</text>
  <text x="374" y="222" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#859D91">(control plane + workers &#183; Docker containers &#183; API port published on localhost)</text>
  <!-- flux glyph -->
  <g transform="translate(130,300)">
    <path d="M0,-18 L15,0 L0,18 L-15,0 Z" fill="#5CE0B4"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#131E18" stroke-width="2.5"/>
    <path d="M-10,24 L0,30 L10,24" fill="none" stroke="#5CE0B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-10,33 L0,39 L10,33" fill="none" stroke="#5CE0B4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="130" y="366" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#FFFFFF">Flux</text>
  <text x="130" y="386" text-anchor="middle" font-family="DejaVu Sans" font-size="13" fill="#859D91">(flux-system)</text>
  <line x1="172" y1="300" x2="240" y2="300" stroke="#859D91" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <!-- sync chip -->
  <rect x="248" y="262" width="380" height="78" rx="10" fill="#1B2C23" stroke="#5CE0B4" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="438" y="290" text-anchor="middle" font-family="DejaVu Sans" font-size="15" fill="#D4E2DA">FluxInstance (installed by helm flux-operator)</text>
  <text x="438" y="316" text-anchor="middle" font-family="DejaVu Sans" font-size="12.5" fill="#859D91">syncs the OCI artifact path</text>
  <text x="438" y="336" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="16" fill="#5CE0B4">workload/local-host/</text>
  <!-- crd layer chip -->
  <rect x="248" y="380" width="380" height="56" rx="10" fill="#1B2C23" stroke="#284637" stroke-width="1.2"/>
  <text x="438" y="404" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold" fill="#B0F6C0">ai-platform/crd</text>
  <text x="438" y="424" text-anchor="middle" font-family="DejaVu Sans" font-size="13.5" fill="#D4E2DA">gateway-api + inference CRDs + agentgateway CRDs</text>
  <line x1="438" y1="436" x2="438" y2="462" stroke="#859D91" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="470" y="454" font-family="DejaVu Sans" font-size="13" fill="#859D91">dependsOn</text>
  <!-- app layer chip -->
  <rect x="248" y="466" width="380" height="96" rx="10" fill="#1B2C23" stroke="#E8A868" stroke-opacity="0.55" stroke-width="1.2"/>
  <g stroke="#E8A868" stroke-width="1.8" fill="none">
    <path d="M286,500 L302,509 L302,527 L286,536 L270,527 L270,509 Z"/>
    <circle cx="286" cy="518" r="4"/>
  </g>
  <text x="316" y="505" font-family="DejaVu Sans Mono" font-size="16" font-weight="bold" fill="#FFFFFF">ai-platform/app</text>
  <text x="316" y="527" font-family="DejaVu Sans" font-size="13.5" fill="#D4E2DA">agentgateway &#183; model-server (vllm-sim)</text>
  <text x="316" y="547" font-family="DejaVu Sans" font-size="13.5" fill="#D4E2DA">InferencePool + llm-d Router EPP &#183; LLM policies</text>
  <!-- lifecycle strip -->
  <rect x="88" y="596" width="572" height="44" rx="8" fill="#5CE0B4" fill-opacity="0.14"/>
  <text x="374" y="624" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#5CE0B4">One cluster manages the whole platform lifecycle</text>
  <!-- port-forward arrow out of the cluster -->
  <path d="M628,514 H1000" fill="none" stroke="#859D91" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="815" y="540" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="15" fill="#E8A868">port-forward &#183; localhost:18080 &#183; /v1/chat/completions</text>

  <!-- ===== local OCI registry ===== -->
  <rect x="620" y="150" width="396" height="330" rx="14" fill="#131E18" stroke="#284637" stroke-width="1.5"/>
  <rect x="636" y="158" width="364" height="5" rx="2.5" fill="#B0F6C0"/>
  <text x="818" y="198" text-anchor="middle" font-family="DejaVu Sans" font-size="25" font-weight="bold" fill="#B0F6C0">Local OCI Registry</text>
  <text x="818" y="222" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="16" fill="#859D91">kaipr-registry:5000</text>
  <!-- artifact box -->
  <rect x="652" y="244" width="332" height="60" rx="10" fill="#1B2C23" stroke="#B0F6C0" stroke-opacity="0.6" stroke-width="1.2"/>
  <text x="818" y="269" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="17" font-weight="bold" fill="#B0F6C0">oci://kaipr-registry:5000/kaipr</text>
  <text x="818" y="292" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="15" fill="#D4E2DA">kaipr:latest</text>
  <!-- folder tree (single source path) -->
  <g fill="none" stroke-width="1.7">
    <path d="M672,326 h9 l4,5 h15 v16 h-28 z" stroke="#68C5EB"/>
  </g>
  <text x="712" y="344" font-family="DejaVu Sans Mono" font-size="17" font-weight="bold" fill="#68C5EB">workload/local-host/</text>
  <text x="818" y="400" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" fill="#859D91">published from your working tree by</text>
  <text x="818" y="424" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="15" fill="#D4E2DA">mise -E local-host run oci-push</text>
  <text x="818" y="452" text-anchor="middle" font-family="DejaVu Sans" font-size="14" fill="#859D91">no GitHub, no Git clone credentials</text>

  <!-- ===== host box (bottom left) ===== -->
  <rect x="64" y="780" width="620" height="140" rx="14" fill="#131E18" stroke="#284637" stroke-width="1.5"/>
  <rect x="80" y="788" width="588" height="5" rx="2.5" fill="#68C5EB"/>
  <text x="374" y="826" text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#68C5EB">Your host</text>
  <text x="374" y="856" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="16" fill="#D4E2DA">.kube/kaipr.yaml &#183; KUBECONFIG for kubectl / flux</text>
  <text x="374" y="884" text-anchor="middle" font-family="DejaVu Sans" font-size="14.5" fill="#859D91">kind publishes the API port on localhost: works as-is, no rewrite</text>

  <!-- ===== legend strip ===== -->
  <rect x="64" y="948" width="966" height="60" rx="12" fill="#131E18" stroke="#284637" stroke-width="1.5"/>
  <circle cx="110" cy="978" r="7" fill="#5CE0B4"/>
  <text x="130" y="984" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#5CE0B4">cluster (kaipr)</text>
  <circle cx="300" cy="978" r="7" fill="#B0F6C0"/>
  <text x="320" y="984" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#B0F6C0">OCI registry</text>
  <circle cx="470" cy="978" r="7" fill="#68C5EB"/>
  <text x="490" y="984" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#68C5EB">host / sync path</text>
  <circle cx="680" cy="978" r="7" fill="#E8A868"/>
  <text x="700" y="984" font-family="DejaVu Sans" font-size="16" font-weight="bold" fill="#E8A868">AI platform</text>

  <!-- ===== flow panel ===== -->
  <rect x="1090" y="150" width="446" height="858" rx="14" fill="#131E18" stroke="#284637" stroke-width="1.5"/>

  <!-- step 1 -->
  <circle cx="1140" cy="208" r="15" fill="#B0F6C0"/>
  <text x="1140" y="214" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">1</text>
  <text x="1168" y="204" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Toolbox creates the kind cluster</text>
  <text x="1168" y="230" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">and the local registry; <tspan font-family="DejaVu Sans Mono" font-size="16" fill="#B0F6C0">oci-push</tspan></text>
  <text x="1168" y="256" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">publishes workload/ as kaipr:latest.</text>
  <text x="1168" y="282" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">No GitHub PAT, no cloud account,</text>
  <text x="1168" y="308" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">no plaintext secrets anywhere.</text>
  <line x1="1122" y1="342" x2="1504" y2="342" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 2 -->
  <circle cx="1140" cy="390" r="15" fill="#5CE0B4"/>
  <text x="1140" y="396" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">2</text>
  <text x="1168" y="386" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Imperative seed: helm installs</text>
  <text x="1168" y="412" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">flux-operator, then a FluxInstance</text>
  <text x="1168" y="438" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">in flux-system syncs the artifact</text>
  <text x="1168" y="464" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">under <tspan font-family="DejaVu Sans Mono" font-size="16" fill="#5CE0B4">workload/local-host/</tspan>.</text>
  <line x1="1122" y1="498" x2="1504" y2="498" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 3 -->
  <circle cx="1140" cy="546" r="15" fill="#5CE0B4"/>
  <text x="1140" y="552" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">3</text>
  <text x="1168" y="542" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Flux reconciles the AI platform:</text>
  <text x="1168" y="568" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">the CRD layer first, then the app</text>
  <text x="1168" y="594" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">(agentgateway, model-server,</text>
  <text x="1168" y="620" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">InferencePool + EPP, policies).</text>
  <line x1="1122" y1="654" x2="1504" y2="654" stroke="#1F362A" stroke-width="1.2"/>

  <!-- step 4 -->
  <circle cx="1140" cy="702" r="15" fill="#68C5EB"/>
  <text x="1140" y="708" text-anchor="middle" font-family="DejaVu Sans" font-size="15" font-weight="bold" fill="#0C120F">4</text>
  <text x="1168" y="698" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Bootstrap exports .kube/kaipr.yaml.</text>
  <text x="1168" y="724" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">kind publishes the API on localhost,</text>
  <text x="1168" y="750" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">so it works from the host as-is.</text>
  <text x="1168" y="776" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">Verify with a chat request through</text>
  <text x="1168" y="802" font-family="DejaVu Sans" font-size="17" fill="#D4E2DA">the gateway port-forward.</text>
  <line x1="1122" y1="836" x2="1504" y2="836" stroke="#1F362A" stroke-width="1.2"/>

  <!-- golden rule -->
  <text x="1122" y="876" font-family="DejaVu Sans" font-size="22" font-weight="bold" fill="#E5B85C">Golden rule</text>
  <text x="1122" y="908" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">Edit YAML in the tree; never mutate</text>
  <text x="1122" y="934" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">the cluster. Flux tracks the OCI</text>
  <text x="1122" y="960" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">artifact: nothing reconciles until</text>
  <text x="1122" y="986" font-family="DejaVu Sans" font-size="18" fill="#D4E2DA">you <tspan font-family="DejaVu Sans Mono" font-size="17" fill="#FFFFFF">oci-push</tspan> again.</text>

  <!-- ===== footer ===== -->
  <text x="800" y="1032" text-anchor="middle" font-family="DejaVu Sans" font-size="17" fill="#859D91">One kind cluster is the whole platform: no CAPI, no pivot, no management cluster, no plaintext secrets.</text>
</svg>
