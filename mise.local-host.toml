[env]
KAIPR_PROFILE = "local-host"

[tasks.oci-push]
description = "Package the local Git checkout as an OCI artifact and push it to the local registry"
dir = "{{config_root}}"
run = '''
REPO_ROOT="$PWD"

REGISTRY_PORT="${REGISTRY_PORT:-5001}"
# Toolbox runs reach the registry by kind-network name (the CLI exports
# REGISTRY_HOST=kaipr-registry there); host runs default to localhost.
REGISTRY_HOST="${REGISTRY_HOST:-localhost}"
OCI_REPOSITORY="${OCI_REPOSITORY:-kaipr}"
OCI_TAG="${OCI_TAG:-latest}"
OCI_URL="oci://${REGISTRY_HOST}:${REGISTRY_PORT}/${OCI_REPOSITORY}:${OCI_TAG}"
OCI_SOURCE_PATH="workload/local-host"

if [ ! -d "$OCI_SOURCE_PATH" ]; then
  echo "ERROR: OCI source directory does not exist: $OCI_SOURCE_PATH" >&2
  exit 1
fi

if ! curl --fail --silent --show-error "http://${REGISTRY_HOST}:${REGISTRY_PORT}/v2/" >/dev/null; then
  echo "ERROR: local registry is unavailable at ${REGISTRY_HOST}:${REGISTRY_PORT}" >&2
  echo "       Start it with: scripts/toolbox-run.sh bootstrap local-host" >&2
  exit 1
fi

# The wrapper (or raw container caller) supplies all three host-side values.
# A partial tuple is an error; never mix metadata from different checkouts.
if [ "${KAIPR_OCI_GIT_SHA+x}${KAIPR_OCI_GIT_REF+x}${KAIPR_OCI_SOURCE_URL+x}" != "" ]; then
  if [ -z "${KAIPR_OCI_GIT_SHA:-}" ] || [ -z "${KAIPR_OCI_GIT_REF:-}" ] || [ -z "${KAIPR_OCI_SOURCE_URL:-}" ]; then
    echo "ERROR: supply complete OCI metadata: KAIPR_OCI_GIT_SHA, KAIPR_OCI_GIT_REF, KAIPR_OCI_SOURCE_URL" >&2
    exit 1
  fi
  GIT_SHA="$KAIPR_OCI_GIT_SHA"
  GIT_REF="$KAIPR_OCI_GIT_REF"
  SOURCE_URL="$KAIPR_OCI_SOURCE_URL"
else
  GIT_SHA=$(git rev-parse HEAD 2>/dev/null) || {
    echo "ERROR: Git metadata unavailable; forward KAIPR_OCI_GIT_SHA, KAIPR_OCI_GIT_REF, KAIPR_OCI_SOURCE_URL from the host" >&2
    exit 1
  }
  GIT_REF=$(git branch --show-current)
  GIT_REF="${GIT_REF:-detached}"
  SOURCE_URL=$(git config --get remote.origin.url || true)
  SOURCE_URL="${SOURCE_URL:-file://${REPO_ROOT}}"
fi

ARTIFACT_ROOT=$(mktemp -d "${TMPDIR:-/tmp}/kaipr-oci.XXXXXX")
cleanup_artifact_root() {
  rm -rf "$ARTIFACT_ROOT"
}
trap cleanup_artifact_root EXIT
# The artifact preserves the checkout path below the artifact root so the
# FluxInstance's sync.path (workload/local-host) keeps working.
mkdir -p "$ARTIFACT_ROOT/workload"
cp -R "$OCI_SOURCE_PATH" "$ARTIFACT_ROOT/workload/local-host"

echo "==> Packaging workload/local-host"
echo "==> Pushing ${OCI_URL}"
flux push artifact "$OCI_URL" \
  --path="$ARTIFACT_ROOT" \
  --source="$SOURCE_URL" \
  --revision="${GIT_REF}@sha1:${GIT_SHA}" \
  --insecure-registry \
  --reproducible
'''

[tasks.kubeconfigs]
description = "Export the kind cluster kubeconfig to .kube/kaipr.yaml"
run = '''
KUBECONFIG_FILE="${KUBECONFIG_FILE:-.kube/kaipr.yaml}"
mkdir -p "$(dirname "$KUBECONFIG_FILE")"
# kind publishes the API port on localhost, so the exported kubeconfig works
# from the host (and from the toolbox) with no endpoint rewrite.
kind get kubeconfig --name kaipr > "$KUBECONFIG_FILE"
chmod 600 "$KUBECONFIG_FILE"
echo "Wrote ${KUBECONFIG_FILE}"
echo "Use with: KUBECONFIG=${KUBECONFIG_FILE} kubectl get nodes"
'''

[tasks.inference-demo]
description = "Expose the AI inference platform as a browser chat page at http://127.0.0.1:18081"
run = '''
KUBECONFIG_FILE="${KUBECONFIG_FILE:-.kube/kaipr.yaml}"
if [ ! -f "$KUBECONFIG_FILE" ]; then
  echo "ERROR: kubeconfig not found: $KUBECONFIG_FILE" >&2
  echo "       Bootstrap first, or create it with the kubeconfigs helper task (see docs/operations.md)" >&2
  exit 1
fi

GATEWAY_PORT="${GATEWAY_PORT:-18080}"
DEMO_PORT="${DEMO_PORT:-18081}"

# Reuse an existing port-forward to the gateway; start one when absent.
# Note: the port probe only proves *something* listens on $GATEWAY_PORT; an
# unrelated listener would be silently proxied to. Fine for a local demo.
PF_PID=""
if ! nc -z 127.0.0.1 "$GATEWAY_PORT" 2>/dev/null; then
  echo "Starting a port-forward to the inference gateway on 127.0.0.1:${GATEWAY_PORT}"
  kubectl --kubeconfig "$KUBECONFIG_FILE" \
    port-forward --namespace ai-platform service/inference-gateway "${GATEWAY_PORT}:80" &
  PF_PID=$!
  trap 'kill ${PF_PID:-} 2>/dev/null' EXIT
  sleep 2
  if ! nc -z 127.0.0.1 "$GATEWAY_PORT" 2>/dev/null; then
    echo "ERROR: the gateway port-forward did not come up on 127.0.0.1:${GATEWAY_PORT}" >&2
    exit 1
  fi
else
  echo "Reusing the port-forward already listening on 127.0.0.1:${GATEWAY_PORT}"
fi

echo "Inference demo at http://127.0.0.1:${DEMO_PORT}/"
echo "Press Ctrl-C to stop."
python3 scripts/inference-demo.py --port "$DEMO_PORT" \
  --upstream "http://127.0.0.1:${GATEWAY_PORT}"
'''
