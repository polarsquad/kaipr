min_version = "2026.10.3"

[tools]
go = "1.27.1"
kubectl = "1.37.0"
python = "3.14.8"
kind = "0.33.0"
helm = "4.3.0"
flux2 = "2.9.6"
sops = "3.13.3"
age = "1.3.2"
uv = "0.12.23"

[settings]
env_file = ".env"

[tasks.validate]
description = "Check scripts, cross-check bootstrap config, and build every kustomize overlay"
run = '''
fail=0
for script in bootstrap.sh bootstrap-common.sh teardown.sh scripts/toolbox-run.sh; do
  echo "==> bash -n $script"
  if ! bash -n "$script"; then
    echo "    FAILED: $script" >&2
    fail=1
  fi
done
echo "==> toolbox-run.sh exec (image and CLI args reach the container engine)"
if ! python3 tests/test-toolbox-run-exec.py; then
  echo "    FAILED: toolbox-run.sh exec" >&2
  fail=1
fi
echo "==> toolbox-run.sh .env precedence"
if ! python3 tests/test-toolbox-run-env-precedence.py; then
  echo "    FAILED: toolbox-run.sh .env precedence" >&2
  fail=1
fi
echo "==> docs show toolbox helper runs, not host mise"
if ! python3 tests/test-docs-toolbox-helpers.py; then
  echo "    FAILED: docs toolbox helpers" >&2
  fail=1
fi
echo "==> bootstrap.toml cross-check"
if ! python3 tests/test-bootstrap-config.py; then
  echo "    FAILED: bootstrap.toml cross-check" >&2
  fail=1
fi
echo "==> OCI publication works with host metadata and inaccessible worktree Git"
if ! python3 tests/test-oci-push-worktree.py; then
  echo "    FAILED: oci-push worktree" >&2
  fail=1
fi
echo "==> Python lint (ruff: unused imports, subprocess.run check=)"
if ! uv run ruff check .; then
  echo "    FAILED: Python lint" >&2
  fail=1
fi
for dir in $(find workload -name kustomization.yaml -exec dirname {} \; | sort -u); do
  echo "==> kustomize build $dir"
  if ! kubectl kustomize "$dir" >/dev/null; then
    echo "    FAILED: $dir" >&2
    fail=1
  fi
done
exit $fail
'''

[tasks.sops-keygen]
description = "Generate an age keypair (age.agekey) for SOPS; prints the public key"
run = """
if [ -f age.agekey ]; then
  echo "age.agekey already exists — refusing to overwrite. Delete it first to regenerate." >&2
  exit 1
fi
age-keygen -o age.agekey
echo
PUBLIC_KEY=$(age-keygen -y age.agekey)
echo "Public key: $PUBLIC_KEY"
echo "Add this public key to the 'age:' field in .sops.yaml, then run: mise run sops-updatekeys"
"""

[tasks.sops-encrypt]
description = "Encrypt a *.sops.yaml manifest in place (usage: mise run sops-encrypt <file>)"
run = "sops --encrypt --in-place --input-type yaml --output-type yaml"

[tasks.sops-decrypt]
description = "Decrypt a *.sops.yaml manifest to stdout (usage: mise run sops-decrypt <file>)"
run = "sops --decrypt --input-type yaml --output-type yaml"

[tasks.sops-updatekeys]
description = "Re-encrypt all *.sops.yaml files to match recipients in .sops.yaml"
run = """
for f in $(find workload -name '*.sops.yaml'); do
  echo "==> updatekeys $f"
  sops updatekeys --yes "$f"
done
"""

[tasks.bootstrap]
description = "Bootstrap the local kind cluster and hand off to Flux/GitOps (toolbox container; native path: ./bootstrap.sh)"
run = "scripts/toolbox-run.sh bootstrap"

[tasks.teardown]
description = "Tear down everything bootstrap created (toolbox container; native path: ./teardown.sh)"
run = "scripts/toolbox-run.sh teardown"
