[project]
name = "kaipr"
version = "0.0.0"
description = "kaipr repository development tools (Python lint)"
requires-python = "==3.14.8"

[dependency-groups]
dev = [
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.ruff.lint]
# F401: unused imports. PLW1510: subprocess.run() must state check= explicitly
# (the default silently swallows non-zero exit codes). Not a general style
# linter for this repo.
select = ["F401", "PLW1510"]
