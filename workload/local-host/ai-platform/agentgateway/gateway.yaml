# The inference Gateway. No spec.addresses on purpose: on a kind workload
# cluster the agentgateway controller programs a LoadBalancer service, and
# the runbook reads the resolved address back from status. (biggs.dog pins
# IPAddress values because its nodes have fixed LAN IPs; a laptop kind
# cluster does not.)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: ai-platform
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: SameNamespace
