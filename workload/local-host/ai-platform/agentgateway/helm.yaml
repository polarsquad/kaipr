# The agentgateway control plane. The GatewayClass it creates is
# gatewayClassName: agentgateway; the inference-gateway Gateway below binds
# to it. inferenceExtension.enabled=true is what lets the data plane talk to
# the llm-d Router Endpoint Picker over the Gateway API Inference
# Extension protocol (ext-proc).
#
# Prerequisite: the Gateway API CRDs (gateway.networking.k8s.io) and the
# Gateway API Inference Extension CRDs (inference.networking.k8s.io) must
# already be installed cluster-wide before this reconciles. They are
# operator prerequisites, installed once per cluster (see
# docs/runbook-local-host.md) — not workload objects this kustomization
# owns. The agentgateway-crds OCI source in sources.yaml carries the
# agentgateway.dev CRDs (AgentgatewayBackend/Policy/Parameters) that the
# operator installs with the control plane.
#
# The v2.2.1 chart ships no default container securityContext, so the
# hardening is set explicitly here (runAsNonRoot/readOnlyRootFilesystem are
# omitted pending verification of the controller image's UID/write paths,
# the same caveat biggs.dog documents).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: ai-platform
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  interval: 10m
  timeout: 5m
  install:
    createNamespace: false
  values:
    inferenceExtension:
      enabled: true
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
