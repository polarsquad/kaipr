# The agentgateway control plane. The GatewayClass it creates is
# gatewayClassName: agentgateway; the inference-gateway Gateway below binds
# to it. inferenceExtension.enabled=true is what lets the data plane talk to
# the llm-d Router Endpoint Picker over the Gateway API Inference
# Extension protocol (ext-proc).
#
# Prerequisite: the Gateway API CRDs (gateway.networking.k8s.io) and the
# Gateway API Inference Extension CRDs (inference.networking.k8s.io) must
# already be installed cluster-wide before this reconciles. They are
# operator prerequisites, installed once per cluster (see
# docs/inference.md, "CRD prerequisites") - not workload objects this
# kustomization owns. The agentgateway-crds OCI source in sources.yaml and
# the agentgateway-crds HelmRelease below carry the agentgateway.dev CRDs
# (AgentgatewayBackend/Policy/Parameters/Model) that the control plane
# deserializes.
#
# The v1.6.0 chart ships a default container securityContext
# (allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
# runAsNonRoot: true, capabilities drop ALL). The `with/else` in the
# deployment template means setting `securityContext:` in values REPLACES the
# whole block, so the override re-states the chart defaults verbatim and adds
# only the seccomp profile. (The controller image is verified to run with
# runAsNonRoot/readOnlyRootFilesystem - the v1.6.0 chart default sets both.)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: ai-platform
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  # The controller deserializes agentgateway.dev CRDs on start; the CRDs
  # HelmRelease must be Ready first or the controller crash-loops.
  dependsOn:
    - name: agentgateway-crds
  interval: 10m
  timeout: 5m
  install:
    createNamespace: false
  values:
    inferenceExtension:
      enabled: true
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
---
# The agentgateway.dev CRDs. Applied from the matching chart release so the
# CRD schema and the controller that deserializes it are the same version.
# (A CRD/chart version skew is exactly how the v2.2.1-era pin bug shipped:
# the CRD exposed `spec.ai.provider.custom` but the controller could not
# translate it.) Installed in the same namespace as the control plane; the
# CRDs themselves are cluster-scoped.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway-crds
  namespace: ai-platform
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway-crds
    namespace: flux-system
  interval: 10m
