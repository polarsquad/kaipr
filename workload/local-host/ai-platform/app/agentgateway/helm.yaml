# The agentgateway control plane. The GatewayClass it creates is
# gatewayClassName: agentgateway; the inference-gateway Gateway below binds
# to it. inferenceExtension.enabled=true is what lets the data plane talk to
# the llm-d Router Endpoint Picker over the Gateway API Inference
# Extension protocol (ext-proc).
#
# Prerequisites: the Gateway API CRDs (gateway.networking.k8s.io) and the
# Gateway API Inference Extension CRDs (inference.networking.k8s.io), and the
# agentgateway.dev CRDs that the control plane deserializes, are all installed
# by the local-ai-platform-crd Kustomization (../../crd/), which this layer's
# Flux Kustomization depends on (see ../../../flux-ks.yaml).
#
# The v1.6.0 chart ships a default container securityContext
# (allowPrivilegeEscalation: false, readOnlyRootFilesystem: true,
# runAsNonRoot: true, capabilities drop ALL). The `with/else` in the
# deployment template means setting `securityContext:` in values REPLACES the
# whole block, so the override re-states the chart defaults verbatim and adds
# only the seccomp profile. (The controller image is verified to run with
# runAsNonRoot/readOnlyRootFilesystem - the v1.6.0 chart default sets both.)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
  namespace: ai-platform
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
    namespace: flux-system
  # The controller deserializes agentgateway.dev CRDs on start; the CRDs
  # HelmRelease must be Ready first or the controller crash-loops.
  dependsOn:
    - name: agentgateway-crds
  interval: 10m
  timeout: 5m
  install:
    createNamespace: false
  values:
    inferenceExtension:
      enabled: true
    podSecurityContext:
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
# The agentgateway.dev CRDs (AgentgatewayBackend / AgentgatewayPolicy /
# AgentgatewayParameters / AgentgatewayModel) are applied by the
# agentgateway-crds HelmRelease in ../../crd/crds-helm.yaml, which
# local-ai-platform-crd reconciles before this layer. They are no longer
# declared here.
