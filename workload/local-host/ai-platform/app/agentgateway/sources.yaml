---
# agentgateway (control plane + data plane deployer) chart. Pinned to the
# latest *release* line that implements the inference path this reference
# exercises: the `custom` LLM provider on AgentgatewayBackend (added in
# v1.4.0) and Gateway API Inference Extension (InferencePool) support. The
# controller also deploys the data plane itself from its own embedded chart,
# so the control plane and data plane are always the same release.
#
# Do NOT pin the `v2.x` chart line here: it is the kgateway-style
# deployment (KGW_* env vars) whose self-deployed data plane is the legacy
# `agentgateway:0.12.0` image, and whose controller does not translate
# `spec.ai.provider.custom` (AgentgatewayBackend lands in
# TranslationError "no supported LLM provider configured"). biggs.dog uses
# that line as a plain networking gateway, which never exercises the LLM
# path and so does not expose the gap.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/agentgateway/charts/agentgateway
  ref:
    tag: "v1.6.0"
# The agentgateway.dev CRDs (AgentgatewayBackend / AgentgatewayPolicy /
# AgentgatewayParameters / AgentgatewayModel) are NOT sourced here: they are
# applied by the agentgateway-crds OCIRepository + HelmRelease in ../crd/,
# which reconciles before this layer (see ../../flux-ks.yaml). The chart tag
# in ../crd/crds-helm.yaml MUST match the tag above: the controller
# deserializes spec fields the CRD only exposes if they were released in the
# same line (a CRD/chart version skew is how the TranslationError pin bug
# above ships).
