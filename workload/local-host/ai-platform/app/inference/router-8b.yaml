# The second InferencePool + Endpoint Picker, for the Qwen/Qwen3-8B model.
# Same llm-d Router chart as router.yaml, reusing the llm-d-router
# OCIRepository (sources.yaml); the release name (vllm-sim-8b) is
# load-bearing again: the chart names the InferencePool, the EPP
# Deployment/Service, and the RBAC all from it, and the AgentgatewayBackend
# in ../policies/backend-8b.yaml wraps this InferencePool.
#
# httpRoute.create=false: as with router.yaml, this deployment ships no
# route of its own; ../policies/llm-route.yaml is the single LLM-aware
# route on the gateway (now with one header-matched rule per model).
#
# provider.name=none keeps the chart from emitting gateway objects for
# another implementation; agentgateway processes the InferencePool directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm-sim-8b
  namespace: ai-platform
spec:
  chartRef:
    kind: OCIRepository
    name: llm-d-router
    namespace: flux-system
  interval: 10m
  timeout: 5m
  install:
    createNamespace: false
  values:
    provider:
      name: none
    httpRoute:
      create: false
    router:
      modelServers:
        matchLabels:
          app: vllm-sim-8b
        targetPortNumber: 8000
      epp:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
