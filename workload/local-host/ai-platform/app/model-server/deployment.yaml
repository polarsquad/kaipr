# A CPU-reproducible stand-in for a vLLM model server. The
# llm-d-inference-sim image speaks the vLLM /v1/* API (and emits the metrics
# the EPP reads) without model weights or GPUs, so the whole path is
# exercisable on a laptop kind cluster. To run a real model, replace this
# Deployment with a vLLM Deployment and label its pods app: <name> to match
# the llm-d Router's matchLabels (the runbook covers the vLLM overlay).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim
  namespace: ai-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-sim
  template:
    metadata:
      labels:
        app: vllm-sim
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
        - name: vllm-sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.8.2
          args:
            - --model
            - Qwen/Qwen3-32B
            - --port
            - "8000"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: 10m
            limits:
              cpu: 200m
              memory: 128Mi
