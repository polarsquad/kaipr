# The Anthropic-native route: the Anthropic Messages API wire format
# gets its own client-facing path (/v1/messages) because it is a
# different format from the OpenAI chat completions path - the path, not
# the model field, selects the provider. An Anthropic SDK client points
# its base URL at the gateway and works unchanged.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic-llm
  namespace: ai-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/messages
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: anthropic-llm
      timeouts:
        request: 300s
