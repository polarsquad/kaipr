# The Anthropic-native route: the Anthropic Messages API wire format
# gets its own client-facing path (/v1/messages) because it is a
# different format from the OpenAI chat completions path - the path, not
# the model field, selects the provider. Requests arrive in the
# Anthropic shape; on the pinned agentgateway v1.6.0 the completion
# comes back in the OpenAI chat-completions response shape (the path
# defaults to the completions traffic type) - see docs/inference.md,
# "The native path".
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic-llm
  namespace: ai-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/messages
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: anthropic-llm
      timeouts:
        request: 300s
