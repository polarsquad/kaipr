# An LLM-aware backend that wraps the InferencePool the router chart
# created. Routing an HTTPRoute to this (instead of straight to the
# InferencePool) is what lets agentgateway parse the LLM request/response
# and apply LLM features: token counting, token budgets, guardrails, and LLM
# observability.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: vllm-sim
  namespace: ai-platform
spec:
  ai:
    provider:
      custom:
        backendRef:
          group: inference.networking.k8s.io
          kind: InferencePool
          name: vllm-sim
        model: Qwen/Qwen3-32B
        formats:
          # In this agentgateway API the OpenAI chat-completions format is
          # named Completions; its default upstream path is
          # /v1/chat/completions, and formats[].type must be unique.
          - type: Completions
            path: /v1/chat/completions
