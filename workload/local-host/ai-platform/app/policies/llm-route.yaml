# The LLM-aware route. Both rules match the OpenAI chat-completions path
# and differ only on the X-Gateway-Base-Model-Name header that the
# PreRouting policy (model-routing.yaml) extracts from the request body:
# one rule per model, pointing at the LLM-aware backend (and InferencePool)
# for that model. Keeping the backendRefs on the AgentgatewayBackends is
# what keeps the LLM features (token budget, guardrails) attached to
# per-model routing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vllm-sim-llm
  namespace: ai-platform
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - name: X-Gateway-Base-Model-Name
              value: Qwen/Qwen3-32B
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: vllm-sim
      timeouts:
        request: 300s
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
          headers:
            - name: X-Gateway-Base-Model-Name
              value: Qwen/Qwen3-8B
      backendRefs:
        - group: agentgateway.dev
          kind: AgentgatewayBackend
          name: vllm-sim-8b
      timeouts:
        request: 300s
