# SOPS-encrypted Secrets consumed by the AI platform (see docs/secrets.md).
# Flux decrypts the *.sops.yaml manifests on reconcile of local-ai-platform
# (spec.decryption), so kustomize builds the plaintext Secrets.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - anthropic-key.sops.yaml
