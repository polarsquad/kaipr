# The llm-d Router Gateway chart. It renders the InferencePool (selecting
# the model-server pods by label), the Endpoint Picker (EPP) Deployment and
# Service, and a base HTTPRoute that binds to the inference-gateway Gateway.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: llm-d-router
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/llm-d/charts/llm-d-router-gateway
  ref:
    tag: "v0.9.0"
